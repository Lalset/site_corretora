<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2440">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minhas vendas">
<title>Minhas vendas | Raquel Andrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#0a1a2f; --navy-900:#0d2440; --navy-800:#123258; --navy-700:#1a4173; --navy-600:#22528f;
  --gold-500:#c9a227; --gold-400:#dab84b; --gold-100:#f6ecc9;
  --cream:#faf7f0; --white:#fff; --ink:#1c2733; --ink-soft:#4a5768; --line:#e6e1d3;
  --green:#1e8e4e; --green-bg:#e3f4ea; --amber:#a86a00; --amber-bg:#fdf0d5; --red:#c0392b; --red-bg:#fbe4e1;
  --wa:#128c4a;
  --radius:16px;
  --shadow:0 10px 24px -14px rgba(10,26,47,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Poppins','Inter',sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}

/* Topo */
.top{background:linear-gradient(160deg,var(--navy-900),var(--navy-700));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 0 22px;border-radius:0 0 24px 24px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.45rem}
.top p{margin:2px 0 0;color:var(--gold-400);font-size:.9rem;font-weight:500}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:12px;font-size:1.3rem;display:grid;place-items:center}
.resumo{margin-top:16px;font-size:1rem;color:#e8edf5}
.resumo b{color:#fff}
.resumo .gold{color:var(--gold-400)}

/* Avisos */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--gold-100);border:1px solid #ecdca3;border-radius:14px;padding:12px 14px;margin:14px 0 0;font-size:.92rem}
.banner button{margin-left:auto;flex-shrink:0}

/* Abas e busca */
.tabs{display:flex;gap:8px;margin:16px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:.92rem;white-space:nowrap;color:var(--ink-soft)}
.tab.on{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:rgba(0,0,0,.08);font-size:.8rem}
.tab.on .n{background:rgba(255,255,255,.18)}
.tab.alerta .n{background:var(--red);color:#fff}
.busca{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:12px}

/* Cards */
.lista{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px 16px;border-left:6px solid var(--line);cursor:pointer;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.card.green{border-left-color:var(--green)} .card.amber{border-left-color:var(--gold-500)} .card.red{border-left-color:var(--red)} .card.ok{border-left-color:var(--navy-600)} .card.off{border-left-color:#aab2bd;opacity:.8}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{font-size:1.08rem;color:var(--navy-900)}
.muted{color:var(--ink-soft);font-size:.88rem;margin:2px 0 0}
.dias{flex-shrink:0;font-weight:700;font-size:.82rem;padding:5px 10px;border-radius:999px;white-space:nowrap}
.dias.green{background:var(--green-bg);color:var(--green)} .dias.amber{background:var(--amber-bg);color:var(--amber)} .dias.red{background:var(--red-bg);color:var(--red)} .dias.ok{background:#e4ecf7;color:var(--navy-700)} .dias.off{background:#eceef1;color:#5b6573}
.etapa-linha{margin-top:10px;display:flex;align-items:center;gap:10px}
.etapa-nome{font-weight:600;font-size:.9rem;color:var(--navy-800);white-space:nowrap}
.barra{flex:1;height:6px;background:#eef0f3;border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-600),var(--gold-500));border-radius:99px}
.card-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.82rem}
.tag{padding:3px 9px;border-radius:999px;background:#f1f2f4;color:var(--ink-soft);font-weight:600}
.tag.cobrar{background:var(--red);color:#fff}
.tag.docs-falta{background:var(--amber-bg);color:var(--amber)}

.vazio{text-align:center;padding:40px 16px;color:var(--ink-soft)}
.vazio h2{color:var(--navy-900);font-size:1.2rem;margin-bottom:8px}
.vazio .acoes{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:20px auto 0}

/* Botões */
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn.primary{background:var(--navy-900);color:#fff}
.btn.gold{background:var(--gold-500);color:var(--navy-950)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy-900)}
.btn.danger{background:#fff;border:1px solid #f0c4be;color:var(--red)}
.btn.sm{padding:8px 12px;font-size:.88rem;width:auto;border-radius:10px}
.btn:disabled{opacity:.45}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;background:var(--gold-500);color:var(--navy-950);border:0;border-radius:999px;padding:15px 26px;font-weight:700;font-size:1rem;box-shadow:0 14px 30px -10px rgba(10,26,47,.55);font-family:'Poppins','Inter',sans-serif}

/* Folha (bottom sheet) */
.overlay{position:fixed;inset:0;background:rgba(10,26,47,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--cream);width:100%;max-width:600px;max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom));animation:sobe .22s ease-out;overscroll-behavior:contain}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--cream);z-index:2;padding:12px 16px 10px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.2rem;color:var(--navy-900)}
.sheet-head .fechar{margin-left:auto;background:#fff;border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:1.1rem;flex-shrink:0}
.sheet-body{padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}
.box{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.box h3{font-size:.95rem;color:var(--navy-900);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h3 small{font-family:'Inter',sans-serif;font-weight:600;color:var(--ink-soft);font-size:.82rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.dica{font-size:.83rem;color:var(--ink-soft);margin:0}

.etapa-atual{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.etapa-atual strong{font-family:'Poppins',sans-serif;color:var(--navy-900);font-size:1.05rem;display:block}
.passos{list-style:none;margin:10px 0 0;padding:0}
.passos li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid #f0ede4;font-size:.92rem;cursor:pointer}
.passos li .dot{width:22px;height:22px;border-radius:50%;border:2px solid #cfd5dd;display:grid;place-items:center;font-size:.7rem;flex-shrink:0;color:#fff}
.passos li.feito .dot{background:var(--navy-600);border-color:var(--navy-600)}
.passos li.atual{font-weight:700;color:var(--navy-900)}
.passos li.atual .dot{border-color:var(--gold-500);background:var(--gold-500)}
.passos li span.qd{margin-left:auto;color:var(--ink-soft);font-size:.8rem;font-weight:500}
details summary{cursor:pointer;color:var(--navy-700);font-weight:600;font-size:.9rem;margin-top:10px}

.docs{list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0ede4}
.docs li:first-child{border-top:0}
.docs label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer}
.docs input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy-700);flex-shrink:0}
.docs li.ok label span{text-decoration:line-through;color:var(--ink-soft)}
.docs .rm{background:none;border:0;color:#9aa3ae;font-size:1.1rem;padding:4px 8px}
.add-doc{display:flex;gap:8px;margin-top:10px}
.add-doc input{flex:1}
.progresso{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-bottom:8px}
.progresso i{display:block;height:100%;background:var(--green)}

.hist{list-style:none;margin:0;padding:0;font-size:.88rem}
.hist li{padding:7px 0;border-top:1px solid #f0ede4;display:flex;gap:10px}
.hist li:first-child{border-top:0}
.hist time{color:var(--ink-soft);flex-shrink:0;width:74px;font-variant-numeric:tabular-nums}

/* Formulários */
label.campo{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600;color:var(--navy-900)}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;font-size:16px;font-weight:400;width:100%}
textarea{min-height:90px;resize:vertical}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-weight:500;font-size:.95rem}
.checks input{width:20px;height:20px;accent-color:var(--navy-700)}
.corr-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0ede4}
.corr-item:first-child{border-top:0}
.corr-item div{flex:1}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy-950);color:#fff;padding:11px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:640px){
  .overlay{align-items:center}
  .sheet{border-radius:22px;max-height:88vh}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>Minhas vendas</h1>
      <p id="subtitulo">Raquel Andrade · Corretora</p>
    </div>
    <button class="icon-btn" data-action="config" aria-label="Configurações">⚙️</button>
  </div>
  <div class="wrap"><div class="resumo" id="resumo"></div></div>
</header>

<main class="wrap" id="app"></main>

<button class="fab" data-action="nova">+ Nova venda</button>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="arquivoBackup" accept="application/json,.json" hidden>

<script>
/* =========================================================
   CONFIGURAÇÃO — dá para ajustar à vontade
   ========================================================= */

// Etapas do financiamento. "limite" = quantos dias é normal ficar nela
// antes de ficar vermelho. "espera: true" = etapa em que ela depende do
// correspondente/Caixa (aparece o botão de cobrar e o lembrete).
const ETAPAS = [
  { id:'atendimento',  nome:'Atendimento e simulação',            curto:'Atendimento',    limite:10,
    frase:'estamos fazendo a simulação e vendo as melhores condições para você' },
  { id:'documentos',   nome:'Juntando documentos',                curto:'Documentos',     limite:7,
    frase:'estamos reunindo a sua documentação para enviar à Caixa' },
  { id:'correspondente', nome:'Com o correspondente (análise de crédito)', curto:'Correspondente', limite:5, espera:true,
    frase:'a sua documentação está em análise de crédito na Caixa' },
  { id:'aprovado',     nome:'Crédito aprovado',                   curto:'Aprovado',       limite:5,
    frase:'o seu crédito foi aprovado! 🎉 Agora seguimos para as próximas etapas' },
  { id:'engenharia',   nome:'Avaliação do imóvel (engenharia)',   curto:'Engenharia',     limite:7, espera:true,
    frase:'o imóvel está passando pela avaliação de engenharia da Caixa' },
  { id:'conformidade', nome:'Conformidade e emissão do contrato', curto:'Contrato',       limite:7, espera:true,
    frase:'a Caixa está conferindo a documentação e preparando o seu contrato' },
  { id:'assinatura',   nome:'Assinatura do contrato',             curto:'Assinatura',     limite:5,
    frase:'estamos organizando a assinatura do seu contrato' },
  { id:'cartorio',     nome:'ITBI e registro em cartório',        curto:'Cartório',       limite:20,
    frase:'o contrato está sendo registrado no cartório' },
  { id:'concluida',    nome:'Concluída — chaves entregues',       curto:'Concluída',      final:true,
    frase:'está tudo concluído! Parabéns pela conquista do seu imóvel! 🔑🎉' }
];

const PERFIS = [
  { id:'assalariado', nome:'Assalariado (carteira assinada)' },
  { id:'autonomo',    nome:'Autônomo / informal' },
  { id:'casado',      nome:'Casado(a) ou união estável' },
  { id:'fgts',        nome:'Vai usar FGTS' }
];

// Lista base de documentos. É só um ponto de partida: em cada venda dá
// para acrescentar o que o correspondente pedir.
const DOCS = {
  base:        ['RG e CPF (ou CNH)', 'Comprovante de residência atualizado', 'Certidão de nascimento ou casamento', 'Declaração de Imposto de Renda (se declara)'],
  assalariado: ['Últimos 3 contracheques', 'Carteira de trabalho (CTPS digital)'],
  autonomo:    ['Extratos bancários dos últimos 6 meses', 'Comprovante de renda informal (declaração/DECORE)'],
  casado:      ['RG e CPF do cônjuge', 'Comprovante de renda do cônjuge (se for compor renda)'],
  fgts:        ['Extrato do FGTS', 'Carteira de trabalho (CTPS digital)']
};

const CHAVE = 'painel-vendas-raquel-v1';

/* =========================================================
   ESTADO
   ========================================================= */
let state = carregar();
let aba = 'ativas';
let busca = '';
let abertoId = null;   // venda aberta na folha
let modo = null;       // 'detalhe' | 'form' | 'config'

function vazio(){ return { settings:{ nome:'Raquel', correspondentes:[], intervalo:2, ultimoBackup:null }, vendas:[] }; }
function carregar(){
  try{
    const raw = localStorage.getItem(CHAVE);
    if(raw) return normalizar(JSON.parse(raw));
  }catch(e){}
  return vazio();
}
function normalizar(s){
  const v = vazio();
  s = s || {};
  v.settings = Object.assign(v.settings, s.settings || {});
  if(!Array.isArray(v.settings.correspondentes)) v.settings.correspondentes = [];
  v.vendas = (Array.isArray(s.vendas) ? s.vendas : []).map(x => Object.assign({
    id:uid(), cliente:'', telefone:'', imovel:'', valor:'', perfis:[], correspondenteId:'',
    etapa:'atendimento', etapaDesde:hoje(), status:'ativa', docs:[], notas:'', historico:[], ultimaCobranca:null, criadaEm:hoje()
  }, x));
  return v;
}
function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(state)); }
  catch(e){ aviso('Não consegui salvar neste navegador. Faça uma cópia de segurança!'); }
}

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function hoje(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function agoraHora(){ const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function diaAtras(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function paraData(s){ const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function diasDesde(s){ if(!s) return null; return Math.max(0, Math.round((paraData(hoje()) - paraData(s)) / 86400000)); }
function fmt(s){ if(!s) return ''; const d = paraData(s); const ano = d.getFullYear() !== new Date().getFullYear(); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+(ano ? '/'+d.getFullYear() : ''); }
function textoDias(n){ return n === 0 ? 'hoje' : n === 1 ? 'há 1 dia' : 'há '+n+' dias'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function primeiroNome(s){ return String(s||'').trim().split(/\s+/)[0] || ''; }
function etapa(id){ return ETAPAS.find(e => e.id === id) || ETAPAS[0]; }
function idxEtapa(id){ return Math.max(0, ETAPAS.findIndex(e => e.id === id)); }
function venda(id){ return state.vendas.find(v => v.id === id); }
function corresp(v){
  const lista = state.settings.correspondentes;
  return lista.find(c => c.id === v.correspondenteId) || (lista.length === 1 ? lista[0] : null);
}
function telWa(t){
  let d = String(t||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length <= 11) d = '55' + d;
  return d;
}
function abrirWhats(tel, texto){
  const n = telWa(tel);
  const url = 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function aviso(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(aviso._t); aviso._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function registrar(v, texto){ v.historico.unshift({ dia:hoje(), hora:agoraHora(), texto }); }

function docsDoPerfil(perfis){
  const lista = [...DOCS.base];
  (perfis||[]).forEach(p => (DOCS[p]||[]).forEach(d => { if(!lista.includes(d)) lista.push(d); }));
  return lista;
}

/* Situação de cada venda */
function nivel(v){
  if(v.status === 'cancelada') return 'off';
  const e = etapa(v.etapa);
  if(e.final) return 'ok';
  const n = diasDesde(v.etapaDesde);
  if(n >= e.limite) return 'red';
  if(n >= Math.max(1, e.limite - 2)) return 'amber';
  return 'green';
}
function urgencia(v){ const e = etapa(v.etapa); return e.final ? -1 : diasDesde(v.etapaDesde) / (e.limite || 1) + (precisaCobrar(v) ? 10 : 0); }
function precisaCobrar(v){
  if(v.status !== 'ativa') return false;
  const e = etapa(v.etapa);
  if(!e.espera) return false;
  const ref = (v.ultimaCobranca && v.ultimaCobranca > v.etapaDesde) ? v.ultimaCobranca : v.etapaDesde;
  return diasDesde(ref) >= (Number(state.settings.intervalo) || 2);
}
function docsFaltando(v){ return v.docs.filter(d => !d.ok); }
const ativas = () => state.vendas.filter(v => v.status === 'ativa' && !etapa(v.etapa).final);
const finalizadas = () => state.vendas.filter(v => v.status !== 'ativa' || etapa(v.etapa).final);

/* =========================================================
   MENSAGENS DE WHATSAPP
   ========================================================= */
function msgCobranca(v){
  const c = corresp(v);
  const e = etapa(v.etapa);
  const n = diasDesde(v.etapaDesde);
  const nome = state.settings.nome || '';
  const oi = c && c.nome ? 'Oi, ' + primeiroNome(c.nome) + '! Tudo bem?' : 'Oi! Tudo bem?';
  const denovo = v.ultimaCobranca && v.ultimaCobranca >= v.etapaDesde;
  const passando = denovo ? 'Passando de novo para saber' : 'Passando para saber';
  const imovel = v.imovel ? ' (' + v.imovel + ')' : '';
  let corpo;
  if(e.id === 'correspondente'){
    corpo = `${passando} como está a análise de crédito do(a) cliente *${v.cliente}*${imovel}. A documentação foi enviada em ${fmt(v.etapaDesde)} (${n === 1 ? '1 dia' : n + ' dias'}).\n\nFicou faltando algum documento ou tem alguma pendência que eu possa resolver?`;
  } else if(e.id === 'engenharia'){
    corpo = `${passando} como está a avaliação de engenharia do imóvel do(a) cliente *${v.cliente}*${imovel}, que está em andamento desde ${fmt(v.etapaDesde)}.\n\nTem alguma previsão ou pendência?`;
  } else if(e.id === 'conformidade'){
    corpo = `${passando} como está a conformidade e a emissão do contrato do(a) cliente *${v.cliente}*${imovel}, em andamento desde ${fmt(v.etapaDesde)}.\n\nTem previsão de quando sai o contrato?`;
  } else {
    corpo = `${passando} como está o processo do(a) cliente *${v.cliente}*${imovel}. Estamos na etapa "${e.nome}" desde ${fmt(v.etapaDesde)}.\n\nTem alguma pendência que eu possa resolver?`;
  }
  return `${oi} ${corpo}\n\nObrigada!${nome ? '\n' + nome : ''}`;
}
function msgPedirDocs(v){
  const faltam = docsFaltando(v).map(d => '• ' + d.nome).join('\n');
  const nome = state.settings.nome || '';
  return `Oi, ${primeiroNome(v.cliente)}! Tudo bem? 😊\n\nPara darmos andamento ao seu financiamento, ainda preciso destes documentos:\n\n${faltam}\n\nPode me mandar foto ou PDF por aqui mesmo. Qualquer dúvida, é só me chamar!${nome ? '\n' + nome : ''}`;
}
function msgAtualizacao(v){
  const e = etapa(v.etapa);
  const nome = state.settings.nome || '';
  if(e.final) return `Oi, ${primeiroNome(v.cliente)}! ${e.frase.charAt(0).toUpperCase() + e.frase.slice(1)}\n\nFoi um prazer te acompanhar nessa conquista. Se precisar de qualquer coisa, conte comigo!${nome ? '\n' + nome : ''}`;
  return `Oi, ${primeiroNome(v.cliente)}! Tudo bem? Passando para te atualizar: ${e.frase}.\n\nAssim que tiver novidade eu te aviso. Qualquer dúvida, estou à disposição! 😊${nome ? '\n' + nome : ''}`;
}

/* =========================================================
   TELA PRINCIPAL
   ========================================================= */
function render(){
  document.getElementById('subtitulo').textContent = (state.settings.nome || 'Raquel') + ' · Corretora';

  const at = ativas();
  const cobrar = at.filter(precisaCobrar);
  const comCorr = at.filter(v => v.etapa === 'correspondente');
  const resumo = document.getElementById('resumo');
  if(!state.vendas.length){
    resumo.innerHTML = 'Cadastre suas vendas para acompanhar tudo em um lugar só.';
  } else {
    resumo.innerHTML = `<b>${at.length}</b> ${at.length === 1 ? 'venda' : 'vendas'} em andamento · <b>${comCorr.length}</b> com o correspondente` +
      (cobrar.length ? `<br><span class="gold">🔔 ${cobrar.length} ${cobrar.length === 1 ? 'precisa' : 'precisam'} de cobrança hoje</span>` : '<br>✅ Nenhuma cobrança pendente hoje');
  }

  const app = document.getElementById('app');
  let html = '';

  // Avisos
  if(state.vendas.length && !state.settings.correspondentes.length){
    html += `<div class="banner"><span>📞</span><span>Cadastre o WhatsApp do correspondente para cobrar com um toque.</span><button class="btn sm primary" data-action="config">Cadastrar</button></div>`;
  }
  const semBackup = state.settings.ultimoBackup ? diasDesde(state.settings.ultimoBackup) : null;
  if(state.vendas.length >= 2 && (semBackup === null || semBackup >= 7)){
    html += `<div class="banner"><span>💾</span><span>${semBackup === null ? 'Você ainda não fez uma cópia de segurança.' : 'Última cópia de segurança ' + textoDias(semBackup) + '.'} Os dados ficam só neste celular.</span><button class="btn sm primary" data-action="backup">Salvar</button></div>`;
  }

  if(!state.vendas.length){
    html += `<div class="vazio"><h2>Nenhuma venda por aqui ainda</h2><p>Cadastre as vendas que estão em andamento. Para cada uma, o painel mostra há quantos dias ela está parada e quando é hora de cobrar o correspondente.</p>
      <div class="acoes"><button class="btn primary" data-action="nova">Cadastrar primeira venda</button><button class="btn ghost" data-action="exemplo">Ver um exemplo</button></div></div>`;
    app.innerHTML = html;
    return;
  }

  const fin = finalizadas();
  html += `<div class="tabs" role="tablist">
    <button class="tab ${aba==='ativas'?'on':''}" data-action="aba" data-aba="ativas">Em andamento <span class="n">${at.length}</span></button>
    <button class="tab ${aba==='cobrar'?'on':''} ${cobrar.length?'alerta':''}" data-action="aba" data-aba="cobrar">Cobrar hoje <span class="n">${cobrar.length}</span></button>
    <button class="tab ${aba==='corr'?'on':''}" data-action="aba" data-aba="corr">Com correspondente <span class="n">${comCorr.length}</span></button>
    <button class="tab ${aba==='fin'?'on':''}" data-action="aba" data-aba="fin">Finalizadas <span class="n">${fin.length}</span></button>
  </div>`;
  if(state.vendas.length > 5) html += `<input class="busca" type="search" placeholder="Buscar cliente ou imóvel…" value="${esc(busca)}" data-input="busca">`;

  let lista = aba === 'cobrar' ? cobrar : aba === 'corr' ? comCorr : aba === 'fin' ? fin : at;
  if(busca.trim()){
    const q = busca.trim().toLowerCase();
    lista = lista.filter(v => (v.cliente + ' ' + v.imovel).toLowerCase().includes(q));
  }
  lista = [...lista].sort((a,b) => urgencia(b) - urgencia(a));

  if(!lista.length){
    const msgs = { cobrar:'Nenhuma cobrança para hoje. 🎉', corr:'Nenhuma venda com o correspondente agora.', fin:'Nenhuma venda finalizada ainda.', ativas:'Nenhuma venda em andamento.' };
    html += `<div class="vazio"><p>${busca ? 'Nada encontrado para essa busca.' : msgs[aba]}</p></div>`;
  } else {
    html += '<div class="lista">' + lista.map(cardHtml).join('') + '</div>';
  }
  app.innerHTML = html;
}

function cardHtml(v){
  const e = etapa(v.etapa);
  const nv = nivel(v);
  const n = diasDesde(v.etapaDesde);
  const i = idxEtapa(v.etapa);
  const pct = Math.round(i / (ETAPAS.length - 1) * 100);
  let badge;
  if(v.status === 'cancelada') badge = 'Cancelada';
  else if(e.final) badge = '✔ ' + fmt(v.etapaDesde);
  else badge = n === 0 ? 'Desde hoje' : (n === 1 ? '1 dia' : n + ' dias');
  const falta = docsFaltando(v).length;
  let foot = '';
  if(precisaCobrar(v)) foot += '<span class="tag cobrar">🔔 Cobrar hoje</span>';
  if(v.status === 'ativa' && !e.final && v.docs.length) foot += falta ? `<span class="tag docs-falta">📄 Faltam ${falta} doc.</span>` : '<span class="tag">📄 Docs completos</span>';
  if(v.ultimaCobranca && e.espera && v.status === 'ativa') foot += `<span class="tag">Última cobrança: ${fmt(v.ultimaCobranca)}</span>`;
  return `<button class="card ${nv}" data-action="abrir" data-id="${v.id}">
    <div class="card-top"><div><h3>${esc(v.cliente)}</h3>${v.imovel ? `<p class="muted">${esc(v.imovel)}</p>` : ''}</div><span class="dias ${nv}">${badge}</span></div>
    <div class="etapa-linha"><span class="etapa-nome">${esc(e.curto)}</span><span class="barra"><i style="width:${pct}%"></i></span></div>
    ${foot ? `<div class="card-foot">${foot}</div>` : ''}
  </button>`;
}

/* =========================================================
   FOLHA: DETALHE DA VENDA
   ========================================================= */
function abrirFolha(m, id){
  modo = m; abertoId = id || null;
  document.getElementById('overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  renderFolha();
  document.getElementById('sheet').scrollTop = 0;
}
function fecharFolha(){
  document.getElementById('overlay').hidden = true;
  document.body.style.overflow = '';
  modo = null; abertoId = null;
  render();
}
function renderFolha(){
  const s = document.getElementById('sheet');
  if(modo === 'detalhe') s.innerHTML = detalheHtml(venda(abertoId));
  else if(modo === 'form') s.innerHTML = formHtml(abertoId ? venda(abertoId) : null);
  else if(modo === 'config') s.innerHTML = configHtml();
}

function detalheHtml(v){
  if(!v) return '';
  const e = etapa(v.etapa);
  const i = idxEtapa(v.etapa);
  const n = diasDesde(v.etapaDesde);
  const nv = nivel(v);
  const prox = ETAPAS[i+1];
  const c = corresp(v);
  const falta = docsFaltando(v);
  const ok = v.docs.length - falta.length;
  const ativa = v.status === 'ativa';

  let h = `<div class="sheet-head"><div><h2>${esc(v.cliente)}</h2><p class="muted">${[v.imovel, v.valor].filter(Boolean).map(esc).join(' · ') || 'Sem imóvel informado'}</p></div>
    <button class="fechar" data-action="fechar" aria-label="Fechar">✕</button></div><div class="sheet-body">`;

  if(v.status === 'cancelada'){
    h += `<div class="banner" style="margin:0"><span>⛔</span><span>Venda marcada como cancelada.</span><button class="btn sm primary" data-action="reativar" data-id="${v.id}">Reativar</button></div>`;
  }

  // Etapa
  h += `<div class="box"><div class="etapa-atual"><div><small class="muted">Etapa atual</small><strong>${esc(e.nome)}</strong>
      <span class="muted">${e.final ? 'Concluída em ' + fmt(v.etapaDesde) : 'Desde ' + fmt(v.etapaDesde) + ' · ' + textoDias(n)}</span></div>
      ${!e.final ? `<span class="dias ${nv}">${n === 1 ? '1 dia' : n + ' dias'}</span>` : ''}</div>`;
  if(ativa && prox) h += `<button class="btn primary" data-action="avancar" data-id="${v.id}">Avançar para: ${esc(prox.curto)} →</button>`;
  h += `<details><summary>Ver todas as etapas / corrigir</summary><ul class="passos">` +
    ETAPAS.map((et, k) => `<li class="${k < i ? 'feito' : k === i ? 'atual' : ''}" data-action="irpara" data-id="${v.id}" data-etapa="${et.id}">
      <span class="dot">${k < i ? '✓' : ''}</span>${esc(et.nome)}${k === i ? '<span class="qd">atual</span>' : ''}</li>`).join('') +
    `</ul><p class="dica" style="margin-top:8px">Toque numa etapa para mover a venda para ela.</p>
    <label class="campo" style="margin-top:10px">Data de início da etapa atual<input type="date" value="${v.etapaDesde}" data-input="etapaDesde" data-id="${v.id}" max="${hoje()}"></label></details></div>`;

  // Ações WhatsApp
  if(ativa){
    h += `<div class="box"><h3>Mensagens prontas</h3><div class="stack">`;
    if(e.espera){
      h += `<button class="btn wa" data-action="cobrar" data-id="${v.id}">💬 Cobrar ${c ? esc(primeiroNome(c.nome)) + ' (correspondente)' : 'o correspondente'}</button>`;
      h += `<p class="dica">${v.ultimaCobranca && v.ultimaCobranca >= v.etapaDesde ? 'Última cobrança: ' + fmt(v.ultimaCobranca) + ' (' + textoDias(diasDesde(v.ultimaCobranca)) + ').' : 'Ainda não cobrou nesta etapa.'}
        ${!c ? ' <a href="#" data-action="config">Cadastre o correspondente</a> para a mensagem ir direto para ele.' : ''}</p>`;
      if(state.settings.correspondentes.length > 1){
        h += `<label class="campo">Correspondente desta venda<select data-input="correspondenteId" data-id="${v.id}"><option value="">— escolher —</option>${state.settings.correspondentes.map(cc => `<option value="${cc.id}" ${cc.id === v.correspondenteId ? 'selected' : ''}>${esc(cc.nome)}</option>`).join('')}</select></label>`;
      }
    }
    if(falta.length) h += `<button class="btn ghost" data-action="pedirdocs" data-id="${v.id}">📄 Pedir ao cliente os ${falta.length} documentos que faltam</button>`;
    h += `<button class="btn ghost" data-action="atualizar" data-id="${v.id}">📣 Mandar atualização ao cliente</button>`;
    if(v.telefone) h += `<a class="btn ghost" href="https://wa.me/${telWa(v.telefone)}" target="_blank" rel="noopener">Abrir conversa com ${esc(primeiroNome(v.cliente))}</a>`;
    h += `</div></div>`;
  } else if(e.final){
    h += `<div class="box"><div class="stack"><button class="btn ghost" data-action="atualizar" data-id="${v.id}">🎉 Mandar parabéns ao cliente</button></div></div>`;
  }

  // Documentos
  h += `<div class="box"><h3>Documentos <small>${ok} de ${v.docs.length}</small></h3>`;
  if(v.docs.length) h += `<div class="progresso"><i style="width:${v.docs.length ? ok / v.docs.length * 100 : 0}%"></i></div>`;
  h += `<ul class="docs">` + v.docs.map((d, k) => `<li class="${d.ok ? 'ok' : ''}"><label><input type="checkbox" ${d.ok ? 'checked' : ''} data-input="doc" data-id="${v.id}" data-k="${k}"><span>${esc(d.nome)}</span></label>
      <button class="rm" data-action="rmdoc" data-id="${v.id}" data-k="${k}" aria-label="Remover">✕</button></li>`).join('') + `</ul>
    <form class="add-doc" data-form="adddoc" data-id="${v.id}"><input type="text" name="doc" placeholder="Outro documento que pediram…"><button class="btn sm primary" type="submit">Adicionar</button></form>
    <p class="dica" style="margin-top:8px">Lista base. Acrescente o que o correspondente pedir.</p></div>`;

  // Anotações
  h += `<div class="box"><h3>Anotações</h3><textarea placeholder="Ex.: cliente vai mandar o contracheque na sexta…" data-input="notas" data-id="${v.id}">${esc(v.notas)}</textarea></div>`;

  // Histórico
  h += `<div class="box"><h3>Histórico</h3>${v.historico.length ? '<ul class="hist">' + v.historico.slice(0, 40).map(x => `<li><time>${fmt(x.dia)} ${esc(x.hora || '')}</time><span>${esc(x.texto)}</span></li>`).join('') + '</ul>' : '<p class="dica">Nada registrado ainda.</p>'}</div>`;

  // Dados
  h += `<div class="box"><div class="stack">
    ${v.telefone ? `<p class="muted" style="margin:0">📱 ${esc(v.telefone)}</p>` : ''}
    <button class="btn ghost" data-action="editar" data-id="${v.id}">✏️ Editar dados da venda</button>
    ${ativa ? `<button class="btn danger" data-action="cancelar" data-id="${v.id}">Marcar como cancelada / reprovada</button>` : ''}
    <button class="btn danger" data-action="excluir" data-id="${v.id}">Excluir venda</button></div></div>`;

  return h + '</div>';
}

/* =========================================================
   AÇÕES
   ========================================================= */
function moverEtapa(v, novaId){
  if(v.etapa === novaId) return;
  const de = etapa(v.etapa), para = etapa(novaId);
  v.etapa = novaId; v.etapaDesde = hoje();
  if(v.status === 'cancelada') v.status = 'ativa';
  registrar(v, novaId === 'correspondente' ? 'Documentação enviada ao correspondente' : `Etapa: ${de.curto} → ${para.curto}`);
  salvar(); renderFolha();
  aviso(para.final ? 'Venda concluída! 🎉' : 'Etapa atualizada');
}

const acoes = {
  nova(){ abrirFolha('form'); },
  config(){ abrirFolha('config'); },
  fechar(){ fecharFolha(); },
  'voltar-detalhe'(){ abrirFolha('detalhe', abertoId); },
  abrir(el){ abrirFolha('detalhe', el.dataset.id); },
  aba(el){ aba = el.dataset.aba; render(); },
  editar(el){ abrirFolha('form', el.dataset.id); },
  avancar(el){ const v = venda(el.dataset.id); const prox = ETAPAS[idxEtapa(v.etapa) + 1]; if(prox) moverEtapa(v, prox.id); },
  irpara(el){
    const v = venda(el.dataset.id); const alvo = el.dataset.etapa;
    if(alvo === v.etapa) return;
    if(confirm('Mover a venda para "' + etapa(alvo).nome + '"? A contagem de dias recomeça hoje.')) moverEtapa(v, alvo);
  },
  cobrar(el){
    const v = venda(el.dataset.id); const c = corresp(v);
    abrirWhats(c ? c.telefone : '', msgCobranca(v));
    v.ultimaCobranca = hoje();
    registrar(v, 'Cobrou ' + (c ? primeiroNome(c.nome) : 'o correspondente') + ' no WhatsApp');
    salvar(); renderFolha();
  },
  pedirdocs(el){
    const v = venda(el.dataset.id);
    abrirWhats(v.telefone, msgPedirDocs(v));
    registrar(v, 'Pediu ' + docsFaltando(v).length + ' documento(s) ao cliente');
    salvar(); renderFolha();
  },
  atualizar(el){
    const v = venda(el.dataset.id);
    abrirWhats(v.telefone, msgAtualizacao(v));
    registrar(v, 'Mandou atualização ao cliente');
    salvar(); renderFolha();
  },
  rmdoc(el){
    const v = venda(el.dataset.id); const k = +el.dataset.k;
    v.docs.splice(k, 1); salvar(); renderFolha();
  },
  cancelar(el){
    const v = venda(el.dataset.id);
    if(!confirm('Marcar a venda de ' + v.cliente + ' como cancelada/reprovada?')) return;
    v.status = 'cancelada'; registrar(v, 'Venda cancelada/reprovada'); salvar(); renderFolha();
  },
  reativar(el){ const v = venda(el.dataset.id); v.status = 'ativa'; registrar(v, 'Venda reativada'); salvar(); renderFolha(); },
  excluir(el){
    const v = venda(el.dataset.id);
    if(!confirm('Excluir de vez a venda de ' + v.cliente + '? Isso não pode ser desfeito.')) return;
    state.vendas = state.vendas.filter(x => x.id !== v.id); salvar(); fecharFolha(); aviso('Venda excluída');
  },
  rmcorr(el){
    const c = state.settings.correspondentes.find(x => x.id === el.dataset.cid);
    if(!confirm('Remover ' + c.nome + '?')) return;
    state.settings.correspondentes = state.settings.correspondentes.filter(x => x.id !== c.id);
    salvar(); renderFolha();
  },
  backup(){ fazerBackup(); },
  restaurar(){ document.getElementById('arquivoBackup').click(); },
  exemplo(){
    if(state.vendas.length && !confirm('Acrescentar 4 vendas de exemplo às suas? Dá para excluir depois.')) return;
    carregarExemplo(); if(modo) fecharFolha(); else render(); aviso('Exemplos carregados');
  },
  apagar(){
    if(!confirm('Apagar TODAS as vendas deste celular? Faça uma cópia de segurança antes.')) return;
    if(!confirm('Tem certeza? Isso não pode ser desfeito.')) return;
    state.vendas = []; salvar(); fecharFolha(); aviso('Tudo apagado');
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if(!el) {
    if(ev.target.id === 'overlay') fecharFolha();
    return;
  }
  const fn = acoes[el.dataset.action];
  if(fn){ if(el.tagName === 'A') ev.preventDefault(); fn(el); }
});

let tNotas;
document.addEventListener('input', ev => {
  const el = ev.target; const tipo = el.dataset.input;
  if(!tipo) return;
  if(tipo === 'busca'){ busca = el.value; const pos = el.selectionStart; render(); const b = document.querySelector('.busca'); if(b){ b.focus(); b.setSelectionRange(pos, pos); } return; }
  if(tipo === 'notas'){ const v = venda(el.dataset.id); v.notas = el.value; clearTimeout(tNotas); tNotas = setTimeout(salvar, 400); return; }
  if(tipo === 'cfg-nome'){ state.settings.nome = el.value; salvar(); return; }
  if(tipo === 'cfg-intervalo'){ const n = parseInt(el.value, 10); if(n > 0){ state.settings.intervalo = n; salvar(); } return; }
});
document.addEventListener('change', ev => {
  const el = ev.target; const tipo = el.dataset.input;
  if(tipo === 'doc'){
    const v = venda(el.dataset.id); const d = v.docs[+el.dataset.k];
    d.ok = el.checked; if(d.ok) registrar(v, 'Recebeu: ' + d.nome);
    salvar(); renderFolha(); return;
  }
  if(tipo === 'correspondenteId'){ const v = venda(el.dataset.id); v.correspondenteId = el.value; salvar(); renderFolha(); return; }
  if(tipo === 'etapaDesde'){
    const v = venda(el.dataset.id);
    if(el.value && el.value <= hoje()){ v.etapaDesde = el.value; registrar(v, 'Data da etapa corrigida para ' + fmt(el.value)); salvar(); renderFolha(); aviso('Data corrigida'); }
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target; const tipo = f.dataset.form;
  if(!tipo) return;
  ev.preventDefault();
  const fd = new FormData(f);

  if(tipo === 'adddoc'){
    const nome = String(fd.get('doc') || '').trim(); if(!nome) return;
    const v = venda(f.dataset.id); v.docs.push({ nome, ok:false }); salvar(); renderFolha();
    const inp = document.querySelector('[data-form="adddoc"] input'); if(inp) inp.focus();
    return;
  }
  if(tipo === 'addcorr'){
    const nome = String(fd.get('nome') || '').trim(); if(!nome) return;
    const c = { id:uid(), nome, telefone:String(fd.get('telefone') || '').trim() };
    state.settings.correspondentes.push(c);
    if(state.settings.correspondentes.length === 1) state.vendas.forEach(v => { if(!v.correspondenteId) v.correspondenteId = c.id; });
    salvar(); renderFolha(); aviso('Correspondente cadastrado'); return;
  }
  if(tipo === 'venda'){
    const dados = {
      cliente: String(fd.get('cliente') || '').trim(),
      telefone: String(fd.get('telefone') || '').trim(),
      imovel: String(fd.get('imovel') || '').trim(),
      valor: String(fd.get('valor') || '').trim(),
      perfis: fd.getAll('perfis'),
      correspondenteId: String(fd.get('correspondenteId') || '')
    };
    if(!dados.cliente){ aviso('Coloque o nome do cliente'); return; }
    if(abertoId){
      const v = venda(abertoId);
      const novos = docsDoPerfil(dados.perfis).filter(d => !v.docs.some(x => x.nome === d));
      Object.assign(v, dados);
      novos.forEach(d => v.docs.push({ nome:d, ok:false }));
      salvar(); abrirFolha('detalhe', v.id); aviso('Alterações salvas');
    } else {
      let desde = String(fd.get('etapaDesde') || hoje());
      if(desde > hoje()) desde = hoje();
      const v = Object.assign({
        id:uid(), etapa:String(fd.get('etapa') || 'documentos'), etapaDesde:desde, status:'ativa',
        docs: docsDoPerfil(dados.perfis).map(nome => ({ nome, ok:false })), notas:'', historico:[], ultimaCobranca:null, criadaEm:hoje()
      }, dados);
      registrar(v, 'Venda cadastrada na etapa ' + etapa(v.etapa).curto);
      state.vendas.push(v); salvar();
      abrirFolha('detalhe', v.id); aviso('Venda cadastrada');
    }
  }
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && modo) fecharFolha(); });

/* =========================================================
   CÓPIA DE SEGURANÇA
   ========================================================= */
async function fazerBackup(){
  const nomeArq = 'vendas-backup-' + hoje() + '.json';
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  let feito = false;
  try{
    const file = new File([blob], nomeArq, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Cópia de segurança das vendas' });
      feito = true;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  if(!feito){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nomeArq;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  state.settings.ultimoBackup = hoje(); salvar();
  if(modo) renderFolha(); else render();
  aviso('Cópia de segurança salva');
}
document.getElementById('arquivoBackup').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if(!f) return;
  try{
    const dados = JSON.parse(await f.text());
    if(!dados || !Array.isArray(dados.vendas)) throw new Error('formato');
    if(!confirm('Restaurar esta cópia com ' + dados.vendas.length + ' venda(s)? As vendas atuais deste celular serão substituídas.')) return;
    state = normalizar(dados); salvar(); fecharFolha(); aviso('Cópia restaurada');
  }catch(e){ aviso('Esse arquivo não parece uma cópia de segurança do painel.'); }
});

   EXEMPLO
   ========================================================= */
function carregarExemplo(){
  if(!state.settings.correspondentes.length) state.settings.correspondentes.push({ id:'corr-ex', nome:'Marcos (Correspondente Caixa)', telefone:'' });
  const cid = state.settings.correspondentes[0].id;
  const mk = (cliente, imovel, valor, perfis, et, dias, extra) => {
    const v = { id:uid(), cliente, telefone:'', imovel, valor, perfis, correspondenteId:cid, etapa:et, etapaDesde:diaAtras(dias), status:'ativa',
      docs: docsDoPerfil(perfis).map(nome => ({ nome, ok:true })), notas:'', historico:[], ultimaCobranca:null, criadaEm:diaAtras(dias + 10) };
    v.historico.push({ dia:diaAtras(dias), hora:'10:00', texto: et === 'correspondente' ? 'Documentação enviada ao correspondente' : 'Etapa: ' + etapa(et).curto });
    return Object.assign(v, extra || {});
  };
  const a = mk('Juliana Ferreira', 'Residencial Parque das Flores · Apto 302', 'R$ 210.000', ['assalariado','fgts'], 'correspondente', 9, { ultimaCobranca:diaAtras(4) });
  a.historico.unshift({ dia:diaAtras(4), hora:'15:20', texto:'Cobrou Marcos no WhatsApp' });
  const b = mk('Carlos e Renata Souza', 'Casa 2 quartos · Loteamento Sol Nascente', 'R$ 185.000', ['autonomo','casado'], 'documentos', 3);
  b.docs[1].ok = false; b.docs[5].ok = false; b.docs[6].ok = false;
  const c = mk('Pedro Albuquerque', 'Residencial Parque das Flores · Apto 105', 'R$ 198.000', ['assalariado'], 'engenharia', 2);
  const d = mk('Fernanda Lima', 'Edifício Mirante · Apto 801', 'R$ 240.000', ['assalariado','casado'], 'correspondente', 1);
  state.vendas.push(a, b, c, d);
  salvar();
}
