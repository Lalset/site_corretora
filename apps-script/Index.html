<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minhas vendas">
<title>Minhas vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   Cores e letras
   - Atkinson Hyperlegible: feita para ser fácil de ler, inclusive
     em tela pequena e com letra grande.
   - Source Serif: só nos nomes de pessoas e na saudação, para dar
     um tom de bilhete/agenda.
   --------------------------------------------------------------- */
:root{
  --tinta:#1D2B44;        /* texto principal (o azul do site dela) */
  --tinta-suave:#5A6578;
  --papel:#EEF1F5;        /* fundo */
  --folha:#FFFFFF;
  --linha:#DDE3EA;
  --ouro:#C9A227;         /* o dourado do site, só em destaques */
  --ouro-claro:#F7EDC8;
  --whats:#1F8F4E;
  --verde:#2F855A;
  --ambar:#9A6512;
  --vermelho:#B83227;
  --serif:'Source Serif 4', Georgia, serif;
  --sans:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);font-size:17px;line-height:1.5;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px;border-radius:6px}
.wrap{max-width:620px;margin:0 auto;padding:0 18px}
p{margin:0}

/* Cabeçalho: foto + saudação */
.cabeca{display:flex;align-items:center;gap:14px;padding:calc(22px + env(safe-area-inset-top)) 0 4px}
.foto{width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--papel),0 0 0 5px var(--ouro);flex-shrink:0}
.saudacao{font-family:var(--serif);font-weight:600;font-size:1.55rem;line-height:1.15}
.data{color:var(--tinta-suave);font-size:.95rem;margin-top:2px}
.engrenagem{margin-left:auto;align-self:flex-start;background:none;border:0;padding:8px;color:var(--tinta-suave);border-radius:12px}
.engrenagem svg{display:block;width:26px;height:26px}
.sync{font-size:.82rem;color:var(--tinta-suave);margin:6px 0 0 72px;min-height:1.2em}
.sync.erro{color:var(--vermelho);font-weight:700}

/* A nota do dia: escrita como um bilhete, sem caixa */
.nota{margin:22px 0 8px}
.nota p{font-family:var(--serif);font-size:1.22rem;line-height:1.45;font-weight:500}
.nota p + p{margin-top:10px}
.nota .acoes{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* Aviso discreto (backup, correspondente) */
.lembrete{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--ouro-claro);border-radius:14px;padding:12px 14px;margin:14px 0 0;font-size:.95rem}

/* Filtros */
.filtros{display:flex;gap:22px;margin:26px 0 0;border-bottom:2px solid var(--linha);overflow-x:auto;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro{background:none;border:0;padding:10px 0;margin-bottom:-2px;border-bottom:3px solid transparent;color:var(--tinta-suave);font-weight:700;white-space:nowrap;font-size:.98rem}
.filtro.on{color:var(--tinta);border-bottom-color:var(--ouro)}
.filtro span{font-weight:400;margin-left:3px}
.busca{width:100%;border:1px solid var(--linha);background:var(--folha);border-radius:12px;padding:12px 14px;margin-top:14px}

/* Lista: uma folha só, como página de agenda */
.folha{background:var(--folha);border-radius:20px;margin-top:14px;overflow:hidden}
.venda{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:16px;border-top:1px solid var(--linha)}
.folha .venda:first-child{border-top:0}
.contador{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid currentColor;line-height:1}
.contador b{font-size:1.25rem}
.contador small{font-size:.68rem;margin-top:2px}
.c-verde{color:var(--verde)} .c-ambar{color:var(--ambar)} .c-vermelho{color:var(--vermelho)} .c-fim{color:var(--tinta)} .c-off{color:#98A1AE}
.c-vermelho{background:#FBEDEB} .c-ambar{background:#FBF3E4}
.venda .corpo{flex:1;min-width:0}
.nome{display:block;font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1.25}
.situacao{display:block;color:var(--tinta);margin-top:2px}
.extra{display:block;color:var(--tinta-suave);font-size:.92rem;margin-top:3px}
.extra.cobrar{color:var(--vermelho);font-weight:700}

.vazio{padding:34px 4px 10px}
.vazio .nota p{font-size:1.18rem}

/* Botões */
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;text-align:center;line-height:1.3}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn.principal{background:var(--tinta);color:#fff}
.btn.whats{background:var(--whats);color:#fff}
.btn.claro{background:var(--folha);border:1.5px solid var(--linha);color:var(--tinta)}
.btn.perigo{background:none;border:1.5px solid #EBC8C3;color:var(--vermelho)}
.btn.pequeno{width:auto;padding:9px 14px;font-size:.92rem;border-radius:11px;flex-shrink:0}
.nova{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;background:var(--ouro);color:var(--tinta);border:0;border-radius:18px;padding:16px 22px;font-weight:700;font-size:1.02rem;box-shadow:0 10px 24px -8px rgba(29,43,68,.45);display:flex;align-items:center;gap:8px}
.nova[hidden]{display:none}
@media (min-width:700px){ .nova{right:calc(50% - 310px)} }

/* Folha que sobe (detalhes, formulário, configurações) */
.overlay{position:fixed;inset:0;background:rgba(29,43,68,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.painel{background:var(--papel);width:100%;max-width:620px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;padding-bottom:calc(28px + env(safe-area-inset-bottom));animation:sobe .2s ease-out;overscroll-behavior:contain}
@keyframes sobe{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .painel{animation:none} }
@media (min-width:700px){ .overlay{align-items:center} .painel{border-radius:24px;max-height:88vh} }
.painel-topo{position:sticky;top:0;z-index:2;background:var(--papel);padding:18px 18px 12px;display:flex;gap:12px;align-items:flex-start}
.painel-topo h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.2;margin:0}
.painel-topo .sub{color:var(--tinta-suave);margin-top:3px}
.fechar{margin-left:auto;background:var(--folha);border:0;width:44px;height:44px;border-radius:50%;font-size:1.4rem;line-height:1;flex-shrink:0;color:var(--tinta)}
.painel-corpo{padding:0 18px;display:flex;flex-direction:column;gap:14px}
.bloco{background:var(--folha);border-radius:18px;padding:16px}
.bloco h3{font-size:1rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bloco h3 small{font-weight:400;color:var(--tinta-suave);font-size:.92rem}
.pilha{display:flex;flex-direction:column;gap:10px}
.dica{font-size:.9rem;color:var(--tinta-suave)}

.estado{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.3}
.estado-sub{color:var(--tinta-suave);margin:4px 0 14px}
details summary{cursor:pointer;color:var(--tinta-suave);font-weight:700;font-size:.95rem;margin-top:14px;list-style-position:inside}
.etapas{list-style:none;margin:10px 0 0;padding:0}
.etapas li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--linha);cursor:pointer}
.etapas .bola{width:20px;height:20px;border-radius:50%;border:2px solid #C4CCD6;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:.7rem}
.etapas li.feita .bola{background:var(--tinta);border-color:var(--tinta)}
.etapas li.agora{font-weight:700}
.etapas li.agora .bola{background:var(--ouro);border-color:var(--ouro)}

.docs{list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linha)}
.docs li:first-child{border-top:0}
.docs label{flex:1;display:flex;gap:12px;align-items:center;cursor:pointer}
.docs input[type=checkbox]{width:24px;height:24px;accent-color:var(--verde);flex-shrink:0}
.docs li.ok span{color:var(--tinta-suave)}
.docs .tirar{background:none;border:0;color:#9AA3AE;font-size:1.2rem;padding:4px 8px}
.novo-doc{display:flex;gap:8px;margin-top:12px}
.novo-doc input{flex:1}

.tempo{list-style:none;margin:0;padding:0}
.tempo li{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--linha);font-size:.95rem}
.tempo li:first-child{border-top:0}
.tempo time{color:var(--tinta-suave);font-variant-numeric:tabular-nums}

label.campo{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{border:1.5px solid var(--linha);background:var(--folha);border-radius:12px;padding:12px 13px;font-size:17px;font-weight:400;width:100%}
textarea{min-height:96px;resize:vertical}
.marcar{display:flex;flex-direction:column;gap:10px}
.marcar label{display:flex;gap:12px;align-items:center}
.marcar input{width:22px;height:22px;accent-color:var(--tinta)}
.pessoa{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha)}
.pessoa:first-child{border-top:0}
.pessoa div{flex:1}

.dialogo{background:var(--folha);border-radius:20px;padding:22px 18px 18px;max-width:380px;width:calc(100% - 36px);margin:auto}
.dialogo p{margin:0 0 18px;font-size:1.05rem}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#confirma{align-items:center;z-index:70}

.carregando{padding:50px 0;color:var(--tinta-suave);text-align:center}
.giro{width:32px;height:32px;border:4px solid var(--linha);border-top-color:var(--tinta);border-radius:50%;margin:0 auto 12px;animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div class="overlay" id="confirma" hidden><div class="dialogo" role="alertdialog" aria-modal="true"><p id="confirmaTxt"></p><div class="dois"><button class="btn claro" id="confNao" type="button">Voltar</button><button class="btn principal" id="confSim" type="button">Confirmar</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="arquivoBackup" accept="application/json,.json" hidden>

<script>
/* ===============================================================
   AJUSTES RÁPIDOS
   =============================================================== */

// Etapas do financiamento.
//  situacao → como a etapa aparece na lista ("Esperando o correspondente")
//  assunto  → como entra na mensagem de cobrança
//  limite   → quantos dias é normal ficar nela antes de ficar vermelho
//  espera   → etapa em que ela depende do correspondente/Caixa
//  frase    → o que o cliente lê na mensagem de atualização
const ETAPAS = [
  { id:'atendimento', curto:'Atendimento', nome:'Atendimento e simulação', situacao:'Em conversa', limite:10,
    frase:'estamos fazendo a simulação e vendo as melhores condições para você' },
  { id:'documentos', curto:'Documentos', nome:'Juntando documentos', situacao:'Juntando documentos', limite:7,
    frase:'estamos reunindo a sua documentação para enviar à Caixa' },
  { id:'correspondente', curto:'Correspondente', nome:'Com o correspondente (análise de crédito)', situacao:'Esperando o correspondente', assunto:'análise de crédito', limite:5, espera:true,
    frase:'a sua documentação está em análise de crédito na Caixa' },
  { id:'aprovado', curto:'Crédito aprovado', nome:'Crédito aprovado', situacao:'Crédito aprovado', limite:5,
    frase:'o seu crédito foi aprovado! Agora seguimos para as próximas etapas' },
  { id:'engenharia', curto:'Vistoria', nome:'Avaliação do imóvel (engenharia)', situacao:'Esperando a vistoria da Caixa', assunto:'avaliação de engenharia', limite:7, espera:true,
    frase:'o imóvel está passando pela avaliação de engenharia da Caixa' },
  { id:'conformidade', curto:'Contrato', nome:'Conformidade e emissão do contrato', situacao:'Esperando o contrato', assunto:'conformidade e emissão do contrato', limite:7, espera:true,
    frase:'a Caixa está conferindo a documentação e preparando o seu contrato' },
  { id:'assinatura', curto:'Assinatura', nome:'Assinatura do contrato', situacao:'Marcando a assinatura', limite:5,
    frase:'estamos organizando a assinatura do seu contrato' },
  { id:'cartorio', curto:'Cartório', nome:'ITBI e registro em cartório', situacao:'No cartório', limite:20,
    frase:'o contrato está sendo registrado no cartório' },
  { id:'concluida', curto:'Concluída', nome:'Concluída, chaves entregues', situacao:'Chaves entregues', final:true,
    frase:'está tudo concluído! Parabéns pela conquista do seu imóvel!' }
];

const PERFIS = [
  { id:'assalariado', nome:'Assalariado (carteira assinada)' },
  { id:'autonomo',    nome:'Autônomo ou informal' },
  { id:'casado',      nome:'Casado(a) ou união estável' },
  { id:'fgts',        nome:'Vai usar FGTS' }
];

// Lista base de documentos. Em cada venda dá para acrescentar
// o que o correspondente pedir.
const DOCS = {
  base:        ['RG e CPF (ou CNH)', 'Comprovante de residência atualizado', 'Certidão de nascimento ou casamento', 'Declaração de Imposto de Renda (se declara)'],
  assalariado: ['Últimos 3 contracheques', 'Carteira de trabalho (CTPS digital)'],
  autonomo:    ['Extratos bancários dos últimos 6 meses', 'Comprovante de renda informal (declaração ou DECORE)'],
  casado:      ['RG e CPF do cônjuge', 'Comprovante de renda do cônjuge (se for compor renda)'],
  fgts:        ['Extrato do FGTS', 'Carteira de trabalho (CTPS digital)']
};

const CHAVE = 'painel-vendas-raquel-v1';

/* ===============================================================
   ONDE OS DADOS FICAM
   Aberto pelo Apps Script → salva na planilha do Google.
   Aberto como arquivo comum → salva só neste navegador.
   =============================================================== */
const MODO_PLANILHA = !!(window.google && google.script && google.script.run);
let carregado = !MODO_PLANILHA;
let erroCarga = '';
let urlPlanilha = '';
let state = MODO_PLANILHA ? vazio() : carregar();
let aba = 'andamento';
let busca = '';
let abertoId = null;
let modo = null;  // 'detalhe' | 'form' | 'config'

function vazio(){ return { settings:{ nome:'Raquel', correspondentes:[], intervalo:2, ultimoBackup:null }, vendas:[] }; }
function carregar(){
  try{ const raw = localStorage.getItem(CHAVE); if(raw) return normalizar(JSON.parse(raw)); }catch(e){}
  return vazio();
}
function normalizar(s){
  const v = vazio(); s = s || {};
  v.settings = Object.assign(v.settings, s.settings || {});
  if(!Array.isArray(v.settings.correspondentes)) v.settings.correspondentes = [];
  v.vendas = (Array.isArray(s.vendas) ? s.vendas : []).map(x => Object.assign({
    id:uid(), cliente:'', telefone:'', imovel:'', valor:'', perfis:[], correspondenteId:'',
    etapa:'atendimento', etapaDesde:hoje(), status:'ativa', docs:[], notas:'', historico:[], ultimaCobranca:null, criadaEm:hoje()
  }, x));
  return v;
}
function salvar(){
  if(MODO_PLANILHA){ agendarSync(); return; }
  try{ localStorage.setItem(CHAVE, JSON.stringify(state)); }
  catch(e){ aviso('Não deu para salvar neste navegador. Faça uma cópia de segurança.'); }
}

/* ---------- Sincronização com a planilha ---------- */
let snap = { vendas:{}, settings:'', corr:'' };   // o que a planilha já tem
let syncTimer = null, sincronizando = false, deNovo = false, tentativas = 0;

function cfgResumo(){ return JSON.stringify({ nome:state.settings.nome || '', intervalo:Number(state.settings.intervalo) || 2 }); }
function marcarSincronizado(){
  snap = { vendas:{}, settings:cfgResumo(), corr:JSON.stringify(state.settings.correspondentes) };
  state.vendas.forEach(v => { snap.vendas[v.id] = JSON.stringify(v); });
}
function linhaPlanilha(v){
  const e = etapa(v.etapa), c = corresp(v), falta = docsFaltando(v);
  return Object.assign({}, v, {
    perfilTxt: v.perfis.map(p => (PERFIS.find(x => x.id === p) || { nome:p }).nome).join(', '),
    corrNome: c ? c.nome : '',
    etapaNome: e.nome,
    situacao: v.status === 'cancelada' ? 'Cancelada' : e.final ? 'Concluída' : 'Em andamento',
    contarDias: v.status === 'ativa' && !e.final,
    docsTxt: v.docs.length ? (v.docs.length - falta.length) + ' de ' + v.docs.length : '',
    faltandoTxt: falta.map(d => d.nome).join(', ')
  });
}
function montarLote(){
  const lote = { vendas:[], excluir:[], settings:null, correspondentes:null };
  const enviado = { vendas:{}, excluir:[], settings:null, corr:null };
  const ids = new Set();
  const corrMudou = JSON.stringify(state.settings.correspondentes) !== snap.corr;
  state.vendas.forEach(v => {
    ids.add(v.id);
    const s = JSON.stringify(v);
    // se os correspondentes mudaram, regrava as vendas (o nome dele aparece na planilha)
    if(snap.vendas[v.id] !== s || corrMudou){ lote.vendas.push(linhaPlanilha(v)); enviado.vendas[v.id] = s; }
  });
  Object.keys(snap.vendas).forEach(id => { if(!ids.has(id)){ lote.excluir.push(id); enviado.excluir.push(id); } });
  if(cfgResumo() !== snap.settings){ lote.settings = JSON.parse(cfgResumo()); enviado.settings = cfgResumo(); }
  if(corrMudou){ lote.correspondentes = state.settings.correspondentes; enviado.corr = JSON.stringify(state.settings.correspondentes); }
  const nada = !lote.vendas.length && !lote.excluir.length && !lote.settings && !lote.correspondentes;
  return { lote, enviado, nada };
}
function temPendencia(){ return MODO_PLANILHA && carregado && !montarLote().nada; }
function agendarSync(){
  if(!carregado) return;
  statusSync('salvando');
  clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, 600);
}
function sincronizar(){
  if(sincronizando){ deNovo = true; return; }
  const { lote, enviado, nada } = montarLote();
  if(nada){ statusSync('ok'); return; }
  sincronizando = true; statusSync('salvando');
  google.script.run
    .withSuccessHandler(() => {
      Object.assign(snap.vendas, enviado.vendas);
      enviado.excluir.forEach(id => delete snap.vendas[id]);
      if(enviado.settings) snap.settings = enviado.settings;
      if(enviado.corr) snap.corr = enviado.corr;
      sincronizando = false; tentativas = 0;
      if(deNovo || temPendencia()){ deNovo = false; sincronizar(); } else statusSync('ok');
    })
    .withFailureHandler(() => {
      sincronizando = false; tentativas++;
      statusSync('erro');
      clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, Math.min(30000, 4000 * tentativas));
    })
    .sincronizar(lote);
}
function statusSync(s){
  const el = document.getElementById('sync');
  if(!MODO_PLANILHA){ el.textContent = ''; return; }
  el.className = 'sync' + (s === 'erro' ? ' erro' : '');
  el.textContent = s === 'salvando' ? 'Salvando na planilha…'
    : s === 'erro' ? 'Sem internet agora. O que você fizer fica guardado e vai para a planilha quando a conexão voltar.'
    : s === 'carregando' ? 'Abrindo a planilha…'
    : 'Tudo salvo na planilha';
}
function carregarDaPlanilha(){
  if(!carregado) statusSync('carregando');
  google.script.run
    .withSuccessHandler(dados => {
      if(carregado && (sincronizando || temPendencia())) return; // não atropela o que ainda está sendo salvo
      state = normalizar(dados); urlPlanilha = dados.url || '';
      carregado = true; erroCarga = '';
      marcarSincronizado(); statusSync('ok');
      if(modo === 'detalhe' && !venda(abertoId)) fecharPainel();
      else { if(modo) renderPainel(); render(); }
    })
    .withFailureHandler(err => {
      if(carregado){ statusSync('erro'); return; }
      erroCarga = (err && err.message) || String(err || '');
      statusSync('erro'); render();
    })
    .carregar();
}
window.addEventListener('beforeunload', ev => { if(temPendencia() || sincronizando){ ev.preventDefault(); ev.returnValue = ''; } });

/* ===============================================================
   PEQUENAS AJUDAS
   =============================================================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function hoje(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function agoraHora(){ const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function diaAtras(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function paraData(s){ const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function diasDesde(s){ if(!s) return null; return Math.max(0, Math.round((paraData(hoje()) - paraData(s)) / 86400000)); }
function fmt(s){ if(!s) return ''; const d = paraData(s); const outroAno = d.getFullYear() !== new Date().getFullYear(); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+(outroAno ? '/'+d.getFullYear() : ''); }
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function fmtLongo(s){ const d = paraData(s); return d.getDate() + ' de ' + MESES[d.getMonth()]; }
function quando(s){ const n = diasDesde(s); return n === 0 ? 'hoje' : n === 1 ? 'ontem' : 'em ' + fmtLongo(s); }
function haDias(n){ return n === 0 ? 'desde hoje' : n === 1 ? 'há 1 dia' : 'há ' + n + ' dias'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function primeiroNome(s){ return String(s||'').trim().split(/\s+/)[0] || ''; }
function juntar(lista){ return lista.length <= 1 ? (lista[0] || '') : lista.slice(0,-1).join(', ') + ' e ' + lista[lista.length-1]; }
function etapa(id){ return ETAPAS.find(e => e.id === id) || ETAPAS[0]; }
function idxEtapa(id){ return Math.max(0, ETAPAS.findIndex(e => e.id === id)); }
function venda(id){ return state.vendas.find(v => v.id === id); }
function corresp(v){
  const lista = state.settings.correspondentes;
  return lista.find(c => c.id === v.correspondenteId) || (lista.length === 1 ? lista[0] : null);
}
function telWa(t){ let d = String(t||'').replace(/\D/g,''); if(!d) return ''; if(d.length <= 11) d = '55' + d; return d; }
function abrirWhats(tel, texto){
  const a = document.createElement('a');
  a.href = 'https://wa.me/' + telWa(tel) + '?text=' + encodeURIComponent(texto);
  a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function aviso(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(aviso._t); aviso._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function registrar(v, texto){ v.historico.unshift({ dia:hoje(), hora:agoraHora(), texto }); if(v.historico.length > 120) v.historico.length = 120; }
function docsDoPerfil(perfis){
  const lista = [...DOCS.base];
  (perfis||[]).forEach(p => (DOCS[p]||[]).forEach(d => { if(!lista.includes(d)) lista.push(d); }));
  return lista;
}
function confirmar(msg, textoSim){
  return new Promise(res => {
    const box = document.getElementById('confirma');
    const sim = document.getElementById('confSim'), nao = document.getElementById('confNao');
    document.getElementById('confirmaTxt').textContent = msg;
    sim.textContent = textoSim || 'Confirmar';
    box.hidden = false; nao.focus();
    const fim = ok => { box.hidden = true; sim.onclick = nao.onclick = null; res(ok); };
    sim.onclick = () => fim(true); nao.onclick = () => fim(false);
  });
}
const ICONE_WHATS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>';

/* ---------- Situação de cada venda ---------- */
function tom(v){
  if(v.status === 'cancelada') return 'off';
  const e = etapa(v.etapa);
  if(e.final) return 'fim';
  const n = diasDesde(v.etapaDesde);
  if(n >= e.limite) return 'vermelho';
  if(n >= Math.max(1, e.limite - 2)) return 'ambar';
  return 'verde';
}
function precisaCobrar(v){
  if(v.status !== 'ativa') return false;
  if(!etapa(v.etapa).espera) return false;
  const ref = (v.ultimaCobranca && v.ultimaCobranca > v.etapaDesde) ? v.ultimaCobranca : v.etapaDesde;
  return diasDesde(ref) >= (Number(state.settings.intervalo) || 2);
}
function urgencia(v){ const e = etapa(v.etapa); return e.final ? -1 : diasDesde(v.etapaDesde) / (e.limite || 1) + (precisaCobrar(v) ? 10 : 0); }
function docsFaltando(v){ return v.docs.filter(d => !d.ok); }
const emAndamento = () => state.vendas.filter(v => v.status === 'ativa' && !etapa(v.etapa).final);
const finalizadas = () => state.vendas.filter(v => v.status !== 'ativa' || etapa(v.etapa).final);
function jaCobrouNestaEtapa(v){ return v.ultimaCobranca && v.ultimaCobranca >= v.etapaDesde; }

/* Agrupa as vendas que precisam de cobrança por correspondente */
function gruposDeCobranca(){
  const grupos = new Map();
  emAndamento().filter(precisaCobrar).forEach(v => {
    const c = corresp(v); const k = c ? c.id : '';
    if(!grupos.has(k)) grupos.set(k, { corr:c, vendas:[] });
    grupos.get(k).vendas.push(v);
  });
  return [...grupos.values()];
}

/* ===============================================================
   MENSAGENS DE WHATSAPP
   =============================================================== */
function assinatura(){ const n = state.settings.nome || ''; return n ? '\n' + n : ''; }
function msgCobranca(v){
  const c = corresp(v), e = etapa(v.etapa), n = diasDesde(v.etapaDesde);
  const oi = c && c.nome ? 'Oi, ' + primeiroNome(c.nome) + '! Tudo bem?' : 'Oi! Tudo bem?';
  const passando = jaCobrouNestaEtapa(v) ? 'Passando de novo para saber' : 'Passando para saber';
  const imovel = v.imovel ? ' (' + v.imovel + ')' : '';
  const tempo = n === 1 ? '1 dia' : n + ' dias';
  let corpo;
  if(e.id === 'correspondente') corpo = `${passando} como está a análise de crédito de *${v.cliente}*${imovel}. A documentação foi enviada em ${fmt(v.etapaDesde)}, faz ${tempo}.\n\nFicou faltando algum documento ou tem alguma pendência que eu possa resolver?`;
  else if(e.id === 'engenharia') corpo = `${passando} como está a avaliação de engenharia do imóvel de *${v.cliente}*${imovel}, que começou em ${fmt(v.etapaDesde)}.\n\nTem previsão ou alguma pendência?`;
  else if(e.id === 'conformidade') corpo = `${passando} como está a conformidade e a emissão do contrato de *${v.cliente}*${imovel}, desde ${fmt(v.etapaDesde)}.\n\nTem previsão de quando sai o contrato?`;
  else corpo = `${passando} como está o processo de *${v.cliente}*${imovel}. Estamos na etapa "${e.nome}" desde ${fmt(v.etapaDesde)}.\n\nTem alguma pendência que eu possa resolver?`;
  return `${oi} ${corpo}\n\nObrigada!${assinatura()}`;
}
function msgCobrancaGrupo(grupo){
  if(grupo.vendas.length === 1) return msgCobranca(grupo.vendas[0]);
  const c = grupo.corr;
  const oi = c && c.nome ? 'Oi, ' + primeiroNome(c.nome) + '! Tudo bem?' : 'Oi! Tudo bem?';
  const linhas = grupo.vendas.map(v => {
    const e = etapa(v.etapa), n = diasDesde(v.etapaDesde);
    return `• *${v.cliente}*${v.imovel ? ' (' + v.imovel + ')' : ''}: ${e.assunto || e.nome.toLowerCase()}, desde ${fmt(v.etapaDesde)} (${n === 1 ? '1 dia' : n + ' dias'})`;
  }).join('\n');
  return `${oi} Passando para saber como estão meus clientes com você:\n\n${linhas}\n\nTem alguma pendência que eu possa resolver? Obrigada!${assinatura()}`;
}
function msgPedirDocs(v){
  const faltam = docsFaltando(v).map(d => '• ' + d.nome).join('\n');
  return `Oi, ${primeiroNome(v.cliente)}! Tudo bem?\n\nPara darmos andamento ao seu financiamento, ainda preciso destes documentos:\n\n${faltam}\n\nPode me mandar foto ou PDF por aqui mesmo. Qualquer dúvida, é só me chamar!${assinatura()}`;
}
function msgAtualizacao(v){
  const e = etapa(v.etapa);
  if(e.final) return `Oi, ${primeiroNome(v.cliente)}! ${e.frase.charAt(0).toUpperCase() + e.frase.slice(1)}\n\nFoi um prazer te acompanhar nessa conquista. Se precisar de qualquer coisa, conte comigo!${assinatura()}`;
  return `Oi, ${primeiroNome(v.cliente)}! Tudo bem? Passando para te contar como está: ${e.frase}.\n\nAssim que tiver novidade eu te aviso. Qualquer dúvida, estou à disposição!${assinatura()}`;
}

/* ===============================================================
   TELA PRINCIPAL
   =============================================================== */
function saudacao(){
  const h = new Date().getHours();
  const nome = primeiroNome(state.settings.nome) || 'Raquel';
  return (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', ' + nome;
}
function textoHoje(){
  const t = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function render(){
  document.getElementById('saudacao').textContent = saudacao();
  document.getElementById('hojeTexto').textContent = textoHoje();
  document.getElementById('nova').hidden = !carregado;
  const app = document.getElementById('app');

  if(!carregado){
    app.innerHTML = erroCarga
      ? `<div class="vazio nota"><p>Não consegui abrir a planilha. Veja se a internet está ligada e tente de novo.</p><p class="dica" style="font-family:var(--sans);font-size:.85rem">${esc(erroCarga)}</p><div class="acoes"><button class="btn principal" data-action="recarregar">Tentar de novo</button></div></div>`
      : `<div class="carregando"><div class="giro"></div>Buscando suas vendas…</div>`;
    return;
  }

  if(!state.vendas.length){
    app.innerHTML = `<div class="vazio nota">
      <p>Ainda não tem nenhuma venda aqui.</p>
      <p>Comece pelas que estão em andamento agora. Para cada uma, o painel conta há quantos dias ela está parada e avisa quando é hora de falar com o correspondente.</p>
      <div class="acoes"><button class="btn principal" data-action="nova">Cadastrar a primeira venda</button>
      ${MODO_PLANILHA ? '' : '<button class="btn claro" data-action="exemplo">Ver como fica com exemplos</button>'}</div></div>`;
    return;
  }

  let h = notaDoDia();

  if(!state.settings.correspondentes.length){
    h += `<div class="lembrete"><span>Cadastre o WhatsApp do correspondente para cobrar com um toque.</span><button class="btn pequeno principal" data-action="config">Cadastrar</button></div>`;
  }
  const semBackup = state.settings.ultimoBackup ? diasDesde(state.settings.ultimoBackup) : null;
  if(!MODO_PLANILHA && state.vendas.length >= 2 && (semBackup === null || semBackup >= 7)){
    h += `<div class="lembrete"><span>${semBackup === null ? 'Você ainda não guardou uma cópia das vendas.' : 'A última cópia das vendas foi ' + haDias(semBackup) + '.'} Elas ficam só neste aparelho.</span><button class="btn pequeno principal" data-action="backup">Guardar</button></div>`;
  }

  const and = emAndamento(), comCorr = and.filter(v => etapa(v.etapa).espera), fin = finalizadas();
  h += `<nav class="filtros" aria-label="Filtrar vendas">
    <button class="filtro ${aba==='andamento'?'on':''}" data-action="aba" data-aba="andamento">Em andamento<span>${and.length}</span></button>
    <button class="filtro ${aba==='espera'?'on':''}" data-action="aba" data-aba="espera">Esperando a Caixa<span>${comCorr.length}</span></button>
    <button class="filtro ${aba==='fin'?'on':''}" data-action="aba" data-aba="fin">Finalizadas<span>${fin.length}</span></button>
  </nav>`;
  if(state.vendas.length > 6) h += `<input class="busca" type="search" placeholder="Procurar cliente ou imóvel" value="${esc(busca)}" data-input="busca" aria-label="Procurar">`;

  let lista = aba === 'espera' ? comCorr : aba === 'fin' ? fin : and;
  if(busca.trim()){ const q = busca.trim().toLowerCase(); lista = lista.filter(v => (v.cliente + ' ' + v.imovel).toLowerCase().includes(q)); }
  lista = [...lista].sort((a,b) => urgencia(b) - urgencia(a));

  if(!lista.length){
    const vazios = { espera:'Nenhuma venda esperando a Caixa agora.', fin:'As vendas concluídas e canceladas aparecem aqui.', andamento:'Nenhuma venda em andamento.' };
    h += `<p class="dica" style="padding:20px 2px">${busca ? 'Ninguém com esse nome.' : vazios[aba]}</p>`;
  } else {
    h += '<div class="folha">' + lista.map(linhaHtml).join('') + '</div>';
  }
  app.innerHTML = h;
}

/* O "bilhete" do dia: o que precisa de atenção, em frases */
function notaDoDia(){
  const and = emAndamento();
  const grupos = gruposDeCobranca();
  const comFalta = and.filter(v => etapa(v.etapa).id === 'documentos' && docsFaltando(v).length);
  const frases = [];
  let acoes = '';

  if(grupos.length){
    const nomes = grupos.flatMap(g => g.vendas.map(v => primeiroNome(v.cliente)));
    const quem = grupos.length === 1 && grupos[0].corr ? 'o ' + primeiroNome(grupos[0].corr.nome) : 'o correspondente';
    frases.push(`${juntar(nomes)} ${nomes.length === 1 ? 'está' : 'estão'} esperando resposta. Já faz ${state.settings.intervalo || 2} dias ou mais sem notícia, então vale mandar uma mensagem para ${quem}.`);
    acoes = grupos.map((g, i) => {
      const alvo = g.corr ? primeiroNome(g.corr.nome) : 'o correspondente';
      const sobre = g.vendas.length === 1 ? 'sobre ' + primeiroNome(g.vendas[0].cliente) : 'sobre os ' + g.vendas.length + ' clientes';
      return `<button class="btn whats" data-action="cobrargrupo" data-g="${i}">${ICONE_WHATS}Perguntar ${g.corr ? 'ao ' + esc(alvo) : 'ao correspondente'} ${esc(sobre)}</button>`;
    }).join('');
  } else if(and.length){
    const parada = [...and].sort((a,b) => urgencia(b) - urgencia(a))[0];
    const n = diasDesde(parada.etapaDesde);
    frases.push(n >= 2
      ? `Nenhuma cobrança para hoje. A venda mais parada é a de ${primeiroNome(parada.cliente)}: ${etapa(parada.etapa).situacao.toLowerCase()} ${haDias(n)}.`
      : 'Nenhuma cobrança para hoje. Está tudo andando.');
  } else {
    frases.push('Nenhuma venda em andamento agora. Quando aparecer cliente novo, é só tocar em Nova venda.');
  }

  if(comFalta.length){
    frases.push(comFalta.length === 1
      ? `Faltam documentos de ${primeiroNome(comFalta[0].cliente)}.`
      : `Faltam documentos de ${juntar(comFalta.map(v => primeiroNome(v.cliente)))}.`);
  }
  return `<section class="nota" aria-label="Resumo de hoje">${frases.map(f => `<p>${esc(f)}</p>`).join('')}${acoes ? `<div class="acoes">${acoes}</div>` : ''}</section>`;
}

function linhaHtml(v){
  const e = etapa(v.etapa), t = tom(v), n = diasDesde(v.etapaDesde);
  let contador;
  if(v.status === 'cancelada') contador = '<b>–</b>';
  else if(e.final) contador = '<b>✓</b>';
  else contador = `<b>${n}</b><small>${n === 1 ? 'dia' : 'dias'}</small>`;

  let situacao;
  if(v.status === 'cancelada') situacao = 'Cancelada';
  else if(e.final) situacao = 'Chaves entregues em ' + fmtLongo(v.etapaDesde);
  else situacao = e.situacao + (n === 0 ? ' desde hoje' : ' desde ' + fmtLongo(v.etapaDesde));

  let extra = '';
  const falta = docsFaltando(v).length;
  if(precisaCobrar(v)){
    const c = corresp(v);
    extra = `<span class="extra cobrar">Hora de perguntar ${c ? 'ao ' + esc(primeiroNome(c.nome)) : 'ao correspondente'}</span>`;
  } else if(v.status === 'ativa' && !e.final && falta && idxEtapa(v.etapa) <= 2){
    extra = `<span class="extra">${falta === 1 ? 'Falta 1 documento' : 'Faltam ' + falta + ' documentos'}</span>`;
  } else if(v.imovel){
    extra = `<span class="extra">${esc(v.imovel)}</span>`;
  }

  return `<button class="venda" data-action="abrir" data-id="${v.id}">
    <span class="contador c-${t}" aria-hidden="true">${contador}</span>
    <span class="corpo"><span class="nome">${esc(v.cliente)}</span><span class="situacao">${esc(situacao)}</span>${extra}</span>
  </button>`;
}

/* ===============================================================
   PAINEL QUE SOBE
   =============================================================== */
function abrirPainel(m, id){
  modo = m; abertoId = id || null;
  document.getElementById('overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  renderPainel();
  document.getElementById('painel').scrollTop = 0;
}
function fecharPainel(){
  document.getElementById('overlay').hidden = true;
  document.body.style.overflow = '';
  modo = null; abertoId = null;
  render();
}
function renderPainel(){
  const p = document.getElementById('painel');
  if(modo === 'detalhe') p.innerHTML = detalheHtml(venda(abertoId));
  else if(modo === 'form') p.innerHTML = formHtml(abertoId ? venda(abertoId) : null);
  else if(modo === 'config') p.innerHTML = configHtml();
}

function detalheHtml(v){
  if(!v) return '';
  const e = etapa(v.etapa), i = idxEtapa(v.etapa), n = diasDesde(v.etapaDesde);
  const prox = ETAPAS[i+1], c = corresp(v), falta = docsFaltando(v);
  const ativa = v.status === 'ativa';
  const sub = [v.imovel, v.valor].filter(Boolean).map(esc).join('<br>');

  let h = `<div class="painel-topo"><div><h2>${esc(v.cliente)}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div>
    <button class="fechar" data-action="fechar" aria-label="Fechar">×</button></div><div class="painel-corpo">`;

  if(v.status === 'cancelada'){
    h += `<div class="lembrete" style="margin:0"><span>Esta venda foi marcada como cancelada.</span><button class="btn pequeno principal" data-action="reativar" data-id="${v.id}">Reabrir</button></div>`;
  }

  // Onde a venda está
  h += `<div class="bloco">`;
  if(e.final) h += `<p class="estado">Chaves entregues</p><p class="estado-sub">Concluída em ${fmtLongo(v.etapaDesde)}</p>`;
  else h += `<p class="estado">${esc(e.situacao)} ${n === 0 ? 'desde hoje' : haDias(n)}</p><p class="estado-sub">Nesta etapa desde ${fmtLongo(v.etapaDesde)}</p>`;
  if(ativa && prox) h += `<button class="btn principal" data-action="avancar" data-id="${v.id}">Passar para: ${esc(prox.curto)}</button>`;
  h += `<details><summary>Corrigir a etapa ou a data</summary><ul class="etapas">` +
    ETAPAS.map((et, k) => `<li class="${k < i ? 'feita' : k === i ? 'agora' : ''}" data-action="irpara" data-id="${v.id}" data-etapa="${et.id}"><span class="bola">${k < i ? '✓' : ''}</span>${esc(et.nome)}</li>`).join('') +
    `</ul><p class="dica" style="margin-top:8px">Toque numa etapa para mover a venda para ela.</p>
    <label class="campo" style="margin-top:12px">Começou esta etapa em<input type="date" value="${v.etapaDesde}" data-input="etapaDesde" data-id="${v.id}" max="${hoje()}"></label></details></div>`;

  // Conversas
  if(ativa){
    h += `<div class="bloco"><h3>Mandar mensagem</h3><div class="pilha">`;
    if(e.espera){
      const alvo = c ? 'ao ' + esc(primeiroNome(c.nome)) : 'ao correspondente';
      h += `<button class="btn whats" data-action="cobrar" data-id="${v.id}">${ICONE_WHATS}Perguntar ${alvo} como está</button>`;
      h += `<p class="dica">${jaCobrouNestaEtapa(v) ? 'Você perguntou pela última vez ' + quando(v.ultimaCobranca) + '.' : 'Você ainda não perguntou nesta etapa.'}${!c ? ' <a href="#" data-action="config">Cadastre o correspondente</a> para a mensagem ir direto para ele.' : ''}</p>`;
      if(state.settings.correspondentes.length > 1){
        h += `<label class="campo">Correspondente desta venda<select data-input="correspondenteId" data-id="${v.id}"><option value="">Escolher</option>${state.settings.correspondentes.map(cc => `<option value="${cc.id}" ${cc.id === v.correspondenteId ? 'selected' : ''}>${esc(cc.nome)}</option>`).join('')}</select></label>`;
      }
    }
    if(falta.length) h += `<button class="btn claro" data-action="pedirdocs" data-id="${v.id}">Pedir a ${esc(primeiroNome(v.cliente))} ${falta.length === 1 ? 'o documento que falta' : 'os ' + falta.length + ' documentos que faltam'}</button>`;
    h += `<button class="btn claro" data-action="atualizar" data-id="${v.id}">Contar a ${esc(primeiroNome(v.cliente))} como está</button>`;
    if(v.telefone) h += `<a class="btn claro" href="https://wa.me/${telWa(v.telefone)}" target="_blank" rel="noopener">Abrir conversa com ${esc(primeiroNome(v.cliente))}</a>`;
    h += `</div></div>`;
  } else if(e.final){
    h += `<div class="bloco"><button class="btn whats" data-action="atualizar" data-id="${v.id}">${ICONE_WHATS}Mandar os parabéns a ${esc(primeiroNome(v.cliente))}</button></div>`;
  }

  // Documentos
  const ok = v.docs.length - falta.length;
  h += `<div class="bloco"><h3>Documentos <small>${v.docs.length ? ok + ' de ' + v.docs.length : ''}</small></h3>
    <ul class="docs">` + v.docs.map((d, k) => `<li class="${d.ok ? 'ok' : ''}"><label><input type="checkbox" ${d.ok ? 'checked' : ''} data-input="doc" data-id="${v.id}" data-k="${k}"><span>${esc(d.nome)}</span></label>
      <button class="tirar" data-action="tirardoc" data-id="${v.id}" data-k="${k}" aria-label="Tirar ${esc(d.nome)} da lista">×</button></li>`).join('') + `</ul>
    <form class="novo-doc" data-form="adddoc" data-id="${v.id}"><input type="text" name="doc" placeholder="Outro documento pedido" aria-label="Outro documento"><button class="btn pequeno principal" type="submit">Incluir</button></form></div>`;

  // Anotações
  h += `<div class="bloco"><h3>Anotações</h3><textarea placeholder="Ex.: vai mandar o contracheque na sexta" data-input="notas" data-id="${v.id}" aria-label="Anotações">${esc(v.notas)}</textarea></div>`;

  // Linha do tempo
  h += `<div class="bloco"><h3>O que já aconteceu</h3>${v.historico.length
      ? '<ul class="tempo">' + v.historico.slice(0, 40).map(x => `<li><time>${fmt(x.dia)}, ${esc(x.hora || '')}</time><span>${esc(x.texto)}</span></li>`).join('') + '</ul>'
      : '<p class="dica">Nada ainda.</p>'}</div>`;

  // Dados
  h += `<div class="bloco pilha">
    ${v.telefone ? `<p class="dica">WhatsApp: ${esc(v.telefone)}</p>` : ''}
    <button class="btn claro" data-action="editar" data-id="${v.id}">Editar dados da venda</button>
    ${ativa ? `<button class="btn perigo" data-action="cancelar" data-id="${v.id}">Marcar como cancelada ou reprovada</button>` : ''}
    <button class="btn perigo" data-action="excluir" data-id="${v.id}">Excluir venda</button></div>`;

  return h + '</div>';
}

/* ===============================================================
   O QUE CADA BOTÃO FAZ
   =============================================================== */
function moverEtapa(v, novaId){
  if(v.etapa === novaId) return;
  const de = etapa(v.etapa), para = etapa(novaId);
  v.etapa = novaId; v.etapaDesde = hoje();
  if(v.status === 'cancelada') v.status = 'ativa';
  registrar(v, novaId === 'correspondente' ? 'Mandou a documentação para o correspondente' : `Passou de ${de.curto} para ${para.curto}`);
  salvar(); renderPainel();
  aviso(para.final ? 'Venda concluída. Parabéns!' : 'Agora em: ' + para.curto);
}
function cobrarVendas(vendas, corr){
  vendas.forEach(v => { v.ultimaCobranca = hoje(); registrar(v, 'Perguntou ' + (corr ? 'ao ' + primeiroNome(corr.nome) : 'ao correspondente') + ' como está'); });
  salvar();
}

const acoes = {
  recarregar(){ erroCarga = ''; render(); carregarDaPlanilha(); },
  nova(){ abrirPainel('form'); },
  config(){ abrirPainel('config'); },
  fechar(){ fecharPainel(); },
  'voltar-detalhe'(){ abrirPainel('detalhe', abertoId); },
  abrir(el){ abrirPainel('detalhe', el.dataset.id); },
  aba(el){ aba = el.dataset.aba; render(); },
  editar(el){ abrirPainel('form', el.dataset.id); },
  avancar(el){ const v = venda(el.dataset.id); const prox = ETAPAS[idxEtapa(v.etapa) + 1]; if(prox) moverEtapa(v, prox.id); },
  async irpara(el){
    const v = venda(el.dataset.id), alvo = el.dataset.etapa;
    if(alvo === v.etapa) return;
    if(await confirmar('Mover a venda para "' + etapa(alvo).nome + '"? A contagem de dias recomeça hoje.', 'Mover')) moverEtapa(v, alvo);
  },
  cobrargrupo(el){
    const g = gruposDeCobranca()[+el.dataset.g]; if(!g) return;
    abrirWhats(g.corr ? g.corr.telefone : '', msgCobrancaGrupo(g));
    cobrarVendas(g.vendas, g.corr); render();
  },
  cobrar(el){
    const v = venda(el.dataset.id), c = corresp(v);
    abrirWhats(c ? c.telefone : '', msgCobranca(v));
    cobrarVendas([v], c); renderPainel();
  },
  pedirdocs(el){
    const v = venda(el.dataset.id);
    abrirWhats(v.telefone, msgPedirDocs(v));
    registrar(v, 'Pediu ' + (docsFaltando(v).length === 1 ? '1 documento' : docsFaltando(v).length + ' documentos') + ' ao cliente');
    salvar(); renderPainel();
  },
  atualizar(el){
    const v = venda(el.dataset.id);
    abrirWhats(v.telefone, msgAtualizacao(v));
    registrar(v, 'Contou a novidade ao cliente');
    salvar(); renderPainel();
  },
  tirardoc(el){ const v = venda(el.dataset.id); v.docs.splice(+el.dataset.k, 1); salvar(); renderPainel(); },
  async cancelar(el){
    const v = venda(el.dataset.id);
    if(!await confirmar('Marcar a venda de ' + v.cliente + ' como cancelada ou reprovada?', 'Marcar')) return;
    v.status = 'cancelada'; registrar(v, 'Venda cancelada ou reprovada'); salvar(); renderPainel();
  },
  reativar(el){ const v = venda(el.dataset.id); v.status = 'ativa'; registrar(v, 'Venda reaberta'); salvar(); renderPainel(); },
  async excluir(el){
    const v = venda(el.dataset.id);
    if(!await confirmar('Excluir a venda de ' + v.cliente + '? Não dá para desfazer.', 'Excluir')) return;
    state.vendas = state.vendas.filter(x => x.id !== v.id); salvar(); fecharPainel(); aviso('Venda excluída');
  },
  async tirarcorr(el){
    const c = state.settings.correspondentes.find(x => x.id === el.dataset.cid);
    if(!await confirmar('Tirar ' + c.nome + ' da lista de correspondentes?', 'Tirar')) return;
    state.settings.correspondentes = state.settings.correspondentes.filter(x => x.id !== c.id);
    salvar(); renderPainel();
  },
  backup(){ guardarCopia(); },
  restaurar(){ document.getElementById('arquivoBackup').click(); },
  async exemplo(){
    if(state.vendas.length && !await confirmar('Colocar 4 vendas de exemplo junto com as suas? Dá para excluir depois.', 'Colocar')) return;
    carregarExemplo(); if(modo) fecharPainel(); else render(); aviso('Exemplos colocados');
  },
  async apagar(){
    if(!await confirmar(MODO_PLANILHA ? 'Apagar todas as vendas, inclusive da planilha?' : 'Apagar todas as vendas deste aparelho? Guarde uma cópia antes.', 'Apagar')) return;
    if(!await confirmar('Tem certeza? Não dá para desfazer.', 'Apagar tudo')) return;
    state.vendas = []; salvar(); fecharPainel(); aviso('Vendas apagadas');
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if(!el){ if(ev.target.id === 'overlay') fecharPainel(); return; }
  const fn = acoes[el.dataset.action];
  if(fn){ if(el.tagName === 'A') ev.preventDefault(); fn(el); }
});

let tNotas;
document.addEventListener('input', ev => {
  const el = ev.target, tipo = el.dataset.input;
  if(!tipo) return;
  if(tipo === 'busca'){ busca = el.value; const pos = el.selectionStart; render(); const b = document.querySelector('.busca'); if(b){ b.focus(); b.setSelectionRange(pos, pos); } return; }
  if(tipo === 'notas'){ venda(el.dataset.id).notas = el.value; clearTimeout(tNotas); tNotas = setTimeout(salvar, 400); return; }
  if(tipo === 'cfg-nome'){ state.settings.nome = el.value; salvar(); return; }
  if(tipo === 'cfg-intervalo'){ const n = parseInt(el.value, 10); if(n > 0){ state.settings.intervalo = n; salvar(); } }
});
document.addEventListener('change', ev => {
  const el = ev.target, tipo = el.dataset.input;
  if(tipo === 'doc'){
    const v = venda(el.dataset.id), d = v.docs[+el.dataset.k];
    d.ok = el.checked; if(d.ok) registrar(v, 'Recebeu: ' + d.nome);
    salvar(); renderPainel(); return;
  }
  if(tipo === 'correspondenteId'){ venda(el.dataset.id).correspondenteId = el.value; salvar(); renderPainel(); return; }
  if(tipo === 'etapaDesde'){
    const v = venda(el.dataset.id);
    if(el.value && el.value <= hoje()){ v.etapaDesde = el.value; registrar(v, 'Corrigiu o início da etapa para ' + fmt(el.value)); salvar(); renderPainel(); aviso('Data corrigida'); }
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target, tipo = f.dataset.form;
  if(!tipo) return;
  ev.preventDefault();
  const fd = new FormData(f);

  if(tipo === 'adddoc'){
    const nome = String(fd.get('doc') || '').trim(); if(!nome) return;
    venda(f.dataset.id).docs.push({ nome, ok:false }); salvar(); renderPainel();
    const inp = document.querySelector('[data-form="adddoc"] input'); if(inp) inp.focus();
    return;
  }
  if(tipo === 'addcorr'){
    const nome = String(fd.get('nome') || '').trim(); if(!nome) return;
    const c = { id:uid(), nome, telefone:String(fd.get('telefone') || '').trim() };
    state.settings.correspondentes.push(c);
    if(state.settings.correspondentes.length === 1) state.vendas.forEach(v => { if(!v.correspondenteId) v.correspondenteId = c.id; });
    salvar(); renderPainel(); aviso(primeiroNome(nome) + ' incluído'); return;
  }
  if(tipo === 'venda'){
    const dados = {
      cliente: String(fd.get('cliente') || '').trim(),
      telefone: String(fd.get('telefone') || '').trim(),
      imovel: String(fd.get('imovel') || '').trim(),
      valor: String(fd.get('valor') || '').trim(),
      perfis: fd.getAll('perfis'),
      correspondenteId: String(fd.get('correspondenteId') || '')
    };
    if(!dados.cliente){ aviso('Falta o nome do cliente'); return; }
    if(abertoId){
      const v = venda(abertoId);
      const novos = docsDoPerfil(dados.perfis).filter(d => !v.docs.some(x => x.nome === d));
      Object.assign(v, dados);
      novos.forEach(d => v.docs.push({ nome:d, ok:false }));
      salvar(); abrirPainel('detalhe', v.id); aviso('Alterações salvas');
    } else {
      let desde = String(fd.get('etapaDesde') || hoje());
      if(desde > hoje()) desde = hoje();
      const v = Object.assign({
        id:uid(), etapa:String(fd.get('etapa') || 'documentos'), etapaDesde:desde, status:'ativa',
        docs: docsDoPerfil(dados.perfis).map(nome => ({ nome, ok:false })), notas:'', historico:[], ultimaCobranca:null, criadaEm:hoje()
      }, dados);
      registrar(v, 'Venda cadastrada em: ' + etapa(v.etapa).curto);
      state.vendas.push(v); salvar();
      abrirPainel('detalhe', v.id); aviso('Venda cadastrada');
    }
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Escape') return;
  if(!document.getElementById('confirma').hidden) document.getElementById('confNao').click();
  else if(modo) fecharPainel();
});

/* ===============================================================
   CÓPIA DAS VENDAS (modo sem planilha) E IMPORTAÇÃO
   =============================================================== */
async function guardarCopia(){
  const nomeArq = 'vendas-copia-' + hoje() + '.json';
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  let feito = false;
  try{
    const file = new File([blob], nomeArq, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'Cópia das vendas' }); feito = true; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  if(!feito){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nomeArq;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  state.settings.ultimoBackup = hoje(); salvar();
  if(modo) renderPainel(); else render();
  aviso('Cópia guardada');
}
document.getElementById('arquivoBackup').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if(!f) return;
  try{
    const dados = JSON.parse(await f.text());
    if(!dados || !Array.isArray(dados.vendas)) throw new Error('formato');
    if(!await confirmar('Trazer ' + dados.vendas.length + (dados.vendas.length === 1 ? ' venda' : ' vendas') + ' desta cópia? As vendas que estão ' + (MODO_PLANILHA ? 'na planilha' : 'neste aparelho') + ' agora serão trocadas por elas.', 'Trazer')) return;
    const cfgAtual = state.settings;
    state = normalizar(dados);
    if(MODO_PLANILHA){ state.settings.ultimoBackup = null; if(!state.settings.correspondentes.length) state.settings.correspondentes = cfgAtual.correspondentes; }
    salvar(); fecharPainel(); aviso('Vendas trazidas da cópia');
  }catch(e){ aviso('Esse arquivo não é uma cópia do painel de vendas.'); }
});

/* ===============================================================
   EXEMPLOS (só no modo sem planilha)
   =============================================================== */
function carregarExemplo(){
  if(!state.settings.correspondentes.length) state.settings.correspondentes.push({ id:'corr-ex', nome:'Marcos (correspondente Caixa)', telefone:'' });
  const cid = state.settings.correspondentes[0].id;
  const mk = (cliente, imovel, valor, perfis, et, dias, extra) => {
    const v = { id:uid(), cliente, telefone:'', imovel, valor, perfis, correspondenteId:cid, etapa:et, etapaDesde:diaAtras(dias), status:'ativa',
      docs: docsDoPerfil(perfis).map(nome => ({ nome, ok:true })), notas:'', historico:[], ultimaCobranca:null, criadaEm:diaAtras(dias + 10) };
    v.historico.push({ dia:diaAtras(dias), hora:'10:00', texto: et === 'correspondente' ? 'Mandou a documentação para o correspondente' : 'Passou para ' + etapa(et).curto });
    return Object.assign(v, extra || {});
  };
  const a = mk('Juliana Ferreira', 'Residencial Parque das Flores, apto 302', 'R$ 210.000', ['assalariado','fgts'], 'correspondente', 9, { ultimaCobranca:diaAtras(4) });
  a.historico.unshift({ dia:diaAtras(4), hora:'15:20', texto:'Perguntou ao Marcos como está' });
  const b = mk('Carlos e Renata Souza', 'Casa no Loteamento Sol Nascente', 'R$ 185.000', ['autonomo','casado'], 'documentos', 3);
  b.docs[1].ok = false; b.docs[5].ok = false; b.docs[6].ok = false;
  const c = mk('Pedro Albuquerque', 'Residencial Parque das Flores, apto 105', 'R$ 198.000', ['assalariado'], 'engenharia', 2);
  const d = mk('Fernanda Lima', 'Edifício Mirante, apto 801', 'R$ 240.000', ['assalariado','casado'], 'correspondente', 1);
  state.vendas.push(a, b, c, d);
  salvar();
}

/* ===============================================================
   INÍCIO
   =============================================================== */
document.addEventListener('visibilitychange', () => {
  // ao voltar para o painel (ex.: mexeu no notebook), busca a versão mais nova
  if(document.visibilityState === 'visible' && MODO_PLANILHA && carregado && !modo && !sincronizando && !temPendencia()) carregarDaPlanilha();
});
render();
if(MODO_PLANILHA) carregarDaPlanilha();
</script>
